<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livret de Gardepomme</title>
<meta name="description" content="Registres administratifs de la baronnie de Gardepomme : effectifs, commerces, codex, trésor et impôts.">
<link rel="icon" href="assets/blason.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<a class="skip" href="#page">Aller au contenu</a>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/blason.svg" alt="Blason de Gardepomme" width="48" height="56">
      <div>
        <h1>Gardepomme</h1>
        <p>Livret de la baronnie</p>
      </div>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Afficher le menu">☰</button>
    </div>
    <nav id="nav" class="nav" aria-label="Sections du livret"></nav>
    <div id="session-box" class="session-box"></div>
  </aside>

  <main id="page" class="page" tabindex="-1"></main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2><button class="icon-btn" onclick="closeModal()" aria-label="Fermer">✕</button></header>
    <div id="modal-body" class="modal-body"></div>
    <p id="modal-err" class="modal-err" role="alert"></p>
    <footer>
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button id="modal-ok" class="btn btn-primary" onclick="modalOk()">Enregistrer</button>
    </footer>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div class="loading-bar" aria-hidden="true"></div>

<script src="scripts/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/core.js"></script>
<script src="scripts/auth.js"></script>
<script src="scripts/ui.js"></script>
<script src="scripts/sections/journal.js"></script>
<script src="scripts/sections/effectifs.js"></script>
<script src="scripts/sections/commerces.js"></script>
<script src="scripts/sections/codex.js"></script>
<script src="scripts/sections/finances.js"></script>
<script src="scripts/sections/impots.js"></script>
<script src="scripts/sections/accueil.js"></script>
<script src="scripts/sections/comptes.js"></script>
<script src="scripts/bootstrap.js"></script>
</body>
</html>
